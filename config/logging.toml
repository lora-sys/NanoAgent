[output]
# 日志输出配置
file = "nanoagent.log"
rotation = "10 MB"
level = "INFO"
colorize = true

[format]
# 日志格式
include_timestamp = true
include_level = true
include_thread = false

[performance]
# 性能配置
enable_async = false
buffer_size = 8192

[agent_log]
# Agent执行日志配置
enabled = true
directory = "agent_logs"
file_prefix = "agent_execution"
format = "detailed"  # detailed 或 simple
include_tool_calls = true
include_user_interactions = true