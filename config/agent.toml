[agent]
# Agent行为配置

[behavior]
# Agent行为模式
reflection_interval = 5             # 反思间隔(步数)
auto_complete_threshold = 0.9     # 自动完成阈值
require_confirmation = false      # 是否需要确认

[phases.think]
enabled = true
timeout = 30

[phases.act]
enabled = true  
timeout = 60

[phases.observe]
enabled = true
timeout = 15

[phases.reflect]
enabled = true
timeout = 20