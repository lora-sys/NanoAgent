# LLM 客户端配置

[provider]
# LLM 提供商配置
name = "openai"
base_url = "https://api.openai.com/v1"
model = "gpt-4"

[clients]
# 客户端配置
[clients.openai]
api_key = "${OPENAI_API_KEY}"  # 从环境变量读取
base_url = "https://api.openai.com/v1"
model = "gpt-4"
max_tokens = 4000
temperature = 0.7
timeout = 30

[retry]
# 重试配置
max_attempts = 3
backoff_factor = 2.0
initial_delay = 1.0
retry_on_timeout = true
retry_on_rate_limit = true

[logging]
# LLM 日志配置
enable_trace = true
log_requests = true
log_responses = false
log_latency = true