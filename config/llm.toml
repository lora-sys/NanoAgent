# LLM 客户端配置
# provider 和 model 格式: "provider/model-name"
# 示例: "openai/gpt-4", "anthropic/claude-3", "groq/llama-3.3-70b"
[clients.openai]
provider = "openai"
model = "openai/deepseek-r1"
temperature = 0.7
max_tokens = 4096
timeout = 30

[retry]
max_attempts = 3
backoff_factor = 2.0
initial_delay = 1.0
retry_on_timeout = true
retry_on_rate_limit = true

[logging]
enable_trace = true
log_requests = true
log_responses = false
log_latency = true