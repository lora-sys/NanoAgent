[default]
# 默认LLM配置
provider = "openai"
model = "openai/gpt-5-nano"
temperature = 0.7
max_tokens = 4096
timeout = 30

[retry]
# 重试配置
max_attempts = 3
backoff_factor = 2.0
initial_delay = 1.0
retry_on_timeout = true
retry_on_rate_limit = true

[logging]
# LLM调用日志
enable_trace = true
log_requests = true
log_responses = false
log_latency = true