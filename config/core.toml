[performance]
# 执行性能配置
max_steps = 20                     # 最大执行步数
max_context_tokens = 3500           # 最大上下文token数
context_window_ratio = 0.7           # 上下文窗口使用比例

[memory]
# 内存管理
enable_cache = true                # 是否启用缓存
max_memory_mb = 1024               # 最大内存使用(MB)
gc_interval = 100                 # 垃圾回收间隔(步数)

[debugging]
# 调试配置
enable_trace = true                # 启用跟踪
enable_profiling = false           # 启用性能分析
log_level = "INFO"                 # 日志级别