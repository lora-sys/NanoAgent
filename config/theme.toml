# 主题配置

[ui]
# UI 配置
emoji = true
color = "dark"  # light, dark, auto
ascii_art = true

[display]
# 显示配置
max_line_length = 100
truncate_length = 50
show_timestamps = true
show_step_numbers = true

[progress]
# 进度条配置
enabled = true
style = "tqdm"  # tqdm, simple, none
show_percentage = true
show_eta = true

[colors]
# 颜色配置（dark 主题）
success = "green"
error = "red"
warning = "yellow"
info = "blue"
action = "cyan"
thought = "magenta"