[file_tools]
# 文件工具配置
base_path = "."
max_file_size_mb = 10
allowed_extensions = [".py", ".md", ".txt", ".json", ".toml", ".yaml", ".yml"]
read_only_extensions = [".git", ".env"]

[hitl_tools]
# HITL工具配置
enabled = true
timeout = 300
auto_confirm = false

[security]
# 安全配置
allow_shell_commands = false
allow_network_access = false
max_execution_time = 60